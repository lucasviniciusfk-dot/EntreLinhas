<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Entre Linhas — Cloudflare staging</title>
<style>
html,body{margin:0;min-height:100%;background:#101014;color:#f5f5f5;font:14px system-ui}
#stage-status{position:fixed;z-index:2147483647;right:10px;bottom:10px;padding:8px 12px;border-radius:10px;background:#24242b;color:#fff;box-shadow:0 2px 12px #0008;max-width:min(90vw,460px)}
#stage-status.ok{background:#174b35}#stage-status.err{background:#702a2a}
#stage-test{margin-left:8px;border:0;border-radius:7px;padding:6px 9px;background:#fff;color:#171717;font-weight:600}
</style>
</head>
<body>
<div id="stage-status">Preparando ambiente Cloudflare de testes…</div>
<script>
(async function(){
  const status=document.getElementById('stage-status');
  try{
    const response=await fetch('./index.html',{cache:'no-store'});
    if(!response.ok)throw new Error('Não foi possível carregar o index.html: HTTP '+response.status);
    let source=await response.text();
    const sdk=/<script\s+src=["']https:\/\/cdn\.jsdelivr\.net\/npm\/@supabase\/supabase-js@2["']\s*>\s*<\/script>/i;
    if(!sdk.test(source))throw new Error('SDK do Supabase não encontrado no HTML principal.');
    const injection='<script src="./cloudflare/entrelinhas-api-client.js"><\/script><script src="./cloudflare/entrelinhas-rpc-adapter.staging.js"><\/script><script>(function(){var sdk=window.supabase;if(!sdk||!sdk.createClient)throw new Error("SDK Supabase indisponível");if(sdk.__entrelCloudflareFactoryWrapped)return;sdk.__entrelCloudflareFactoryWrapped=true;var original=sdk.createClient.bind(sdk);sdk.createClient=function(){var client=original.apply(null,arguments);window.__ENTREL_STAGING_SUPABASE_CLIENT__=client;if(window.installEntreLinhasCloudflareRpcAdapter)window.installEntreLinhasCloudflareRpcAdapter(client,{apiBase:"https://entrelinhas-api-staging.lucasviniciusk.workers.dev"});return client;};window.__ENTREL_CLOUDFLARE_STAGING__={enabled:true,api:"https://entrelinhas-api-staging.lucasviniciusk.workers.dev",mode:"rpc-safe-plus-profile-read-test"};})();<\/script>';
    source=source.replace(sdk,match=>match+injection);
    if(!source.includes('__ENTREL_CLOUDFLARE_STAGING__'))throw new Error('Não foi possível instalar os adaptadores no ponto correto.');
    document.open();document.write(source);document.close();
    const panel=document.createElement('div');panel.id='stage-status';panel.className='ok';panel.textContent='STAGING • Auth Supabase preservado • RPCs compatíveis via Worker ';
    const test=document.createElement('button');test.id='stage-test';test.textContent='Testar perfil';test.onclick=async function(){
      test.disabled=true;test.textContent='Testando…';
      try{
        const client=window.__ENTREL_STAGING_SUPABASE_CLIENT__;
        if(!client)throw new Error('Aguarde o carregamento e faça login com Google.');
        const api=window.EntreLinhasCloudflareApi.create({getAccessToken:async function(){const r=await client.auth.getSession();if(r.error)throw r.error;if(!r.data.session)throw new Error('Faça login com Google primeiro.');return r.data.session.access_token;}});
        const checks=[
          ['/api/v1/me','Perfil'],
          ['/api/v1/club/current-book','Livro atual do clube'],
          ['/api/v1/club/library/books?limit=5','Biblioteca do clube'],
          ['/api/v1/library/books?limit=5','Biblioteca pessoal'],
          ['/api/v1/goals?daily_limit=5','Metas'],
          ['/api/v1/reading?limit=5','Leituras'],
          ['/api/v1/notifications?limit=5','Notificações'],
          ['/api/v1/chat/messages?limit=5','Chat'],
          ['/api/v1/challenges','Desafios'],
          ['/api/v1/club/albums?limit=5','Álbuns do clube']
        ];
        const results=[];
        for(const [route,label] of checks){
          try{
            const token=await (async()=>{const s=await client.auth.getSession();if(s.error)throw s.error;if(!s.data.session)throw new Error('Sessão Google ausente');return s.data.session.access_token;})();
            const response=await fetch('https://entrelinhas-api-staging.lucasviniciusk.workers.dev'+route,{headers:{Authorization:'Bearer '+token},cache:'no-store'});
            let payload={};try{payload=await response.json();}catch(_){}
            results.push({route,label,status:response.status,ok:response.ok&&payload.ok===true,error:payload.error||null});
          }catch(e){results.push({route,label,status:0,ok:false,error:e.message||String(e)});}
        }
        const albums=results.find(x=>x.route==='/api/v1/club/albums?limit=5');
        if(albums&&albums.ok){
          try{
            const token=(await client.auth.getSession()).data.session.access_token;
            const albumResponse=await fetch('https://entrelinhas-api-staging.lucasviniciusk.workers.dev/api/v1/club/albums?limit=1',{headers:{Authorization:'Bearer '+token},cache:'no-store'});
            const albumPayload=await albumResponse.json();
            const album=albumPayload.items&&albumPayload.items[0];
            if(album&&album.id){
              const photoResponse=await fetch('https://entrelinhas-api-staging.lucasviniciusk.workers.dev/api/v1/club/albums/photos?album_id='+encodeURIComponent(album.id)+'&limit=5',{headers:{Authorization:'Bearer '+token},cache:'no-store'});
              const photoPayload=await photoResponse.json();
              const photoOk=photoResponse.ok&&photoPayload.ok===true;
              results.push({route:'/api/v1/club/albums/photos?album_id='+album.id,label:'Fotos do álbum',status:photoResponse.status,ok:photoOk,error:photoPayload.error||null});
              if(photoOk&&photoPayload.items&&photoPayload.items.length){
                const photo=photoPayload.items[0];
                const contentResponse=await fetch('https://entrelinhas-api-staging.lucasviniciusk.workers.dev/api/v1/club/albums/photos/'+encodeURIComponent(photo.id)+'/content',{headers:{Authorization:'Bearer '+token},cache:'no-store'});
                const contentType=contentResponse.headers.get('content-type')||'';
                const contentBytes=contentResponse.ok?await contentResponse.arrayBuffer():new ArrayBuffer(0);
                results.push({route:'/api/v1/club/albums/photos/'+photo.id+'/content',label:'Conteúdo da primeira foto',status:contentResponse.status,ok:contentResponse.ok&&contentBytes.byteLength>0&&/^image\\//i.test(contentType),error:contentResponse.ok?(contentBytes.byteLength?'Tipo de conteúdo: '+contentType:'Arquivo vazio'):(contentType||'Falha ao baixar foto')});
              }else if(photoOk){
                results.push({route:'/api/v1/club/albums/photos/:id/content',label:'Conteúdo da primeira foto',status:0,ok:true,error:'Não aplicável: álbum sem fotos.'});
              }
            }else{
              results.push({route:'/api/v1/club/albums/photos',label:'Fotos do álbum',status:0,ok:true,error:'Não aplicável: não há álbum ativo para consultar.'});
            }
          }catch(e){results.push({route:'/api/v1/club/albums/photos',label:'Fotos do álbum',status:0,ok:false,error:e.message||String(e)});}
        }
        const passed=results.filter(x=>x.ok).length;
        const failed=results.length-passed;
        panel.className=failed?'err':'ok';
        panel.firstChild.textContent='LEITURAS STAGING • '+passed+'/'+results.length+' aprovadas • '+failed+' falhas. ';
        test.textContent='Executar novamente';
        console.table(results);
        const oldReport=document.getElementById('stage-read-report');if(oldReport)oldReport.remove();
        const report=document.createElement('pre');report.id='stage-read-report';report.style.cssText='position:fixed;right:10px;bottom:58px;z-index:2147483646;max-width:min(92vw,520px);max-height:55vh;overflow:auto;padding:12px;border-radius:10px;background:#181820;color:#eee;font:12px/1.5 monospace;white-space:pre-wrap';
        report.textContent=results.map(x=>(x.ok?'OK':'FALHA')+' '+x.status+' '+x.label+(x.error?' — '+x.error:'')).join('\\n');
        document.body.appendChild(report);
      }catch(e){panel.className='err';panel.firstChild.textContent='TESTE NÃO CONCLUÍDO • '+(e.message||e)+' ';test.textContent='Tentar novamente';}
      finally{test.disabled=false;}
    };
    panel.appendChild(test);document.body.appendChild(panel);
  }catch(error){
    status.className='err';status.textContent='Falha no staging: '+(error&&error.message||error);
    console.error('[Entre Linhas staging]',error);
  }
})();
</script>
</body>
</html>
