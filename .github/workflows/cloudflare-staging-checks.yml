name: Cloudflare staging checks

on:
  push:
    branches:
      - migration/cloudflare-staging-adapter
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check Worker syntax
        run: node --input-type=module --check < cloudflare/worker-staging.js
      - name: Check client syntax
        run: node --check cloudflare-api-client.js
      - name: Run client contract tests
        run: node tests/test-cloudflare-api-client.js
      - name: Smoke test staging Worker
        env:
          STAGING_API_URL: https://entrelinhas-api-staging.lucasviniciusfk.workers.dev
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';

          const base = process.env.STAGING_API_URL;
          const origin = 'https://lucasviniciusfk-dot.github.io';

          const healthResponse = await fetch(base + '/health');
          assert.equal(healthResponse.status, 200, 'Health endpoint must return HTTP 200');
          const health = await healthResponse.json();
          assert.equal(health.ok, true, 'D1, R2 and Supabase Auth configuration must be ready');
          assert.equal(health.environment, 'staging');
          assert.equal(health.bindings?.d1, true);
          assert.equal(health.bindings?.r2, true);
          assert.equal(health.bindings?.authConfig, true);

          const protectedResponse = await fetch(base + '/api/v1/me', {
            headers: { Origin: origin }
          });
          assert.equal(protectedResponse.status, 401, 'Protected route must reject requests without a bearer token');

          const preflightResponse = await fetch(base + '/api/v1/me', {
            method: 'OPTIONS',
            headers: {
              Origin: origin,
              'Access-Control-Request-Method': 'GET',
              'Access-Control-Request-Headers': 'authorization'
            }
          });
          assert.equal(preflightResponse.status, 204, 'CORS preflight must succeed');
          assert.equal(preflightResponse.headers.get('access-control-allow-origin'), origin);

          console.log('Staging Worker health, D1/R2 bindings, auth guard and CORS: OK');
          NODE
