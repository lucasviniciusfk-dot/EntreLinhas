name: Patch profile Cloudflare bridge

on:
  push:
    branches:
      - migration/profile-cloudflare-shadow-write
    paths:
      - .github/workflows/profile-cloudflare-sync.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v4
        with:
          ref: migration/profile-cloudflare-shadow-write
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply guarded profile bridge
        run: python scripts/patch-profile-cloudflare.py
      - name: Commit patched frontend
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- index.html; then
            git add index.html
            git commit -m "Integrate profile updates with Cloudflare staging"
            git push origin HEAD:migration/profile-cloudflare-shadow-write
          else
            echo "No frontend changes required."
          fi
